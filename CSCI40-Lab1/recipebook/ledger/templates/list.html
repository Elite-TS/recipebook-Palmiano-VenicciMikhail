{% extends 'base.html' %}

{% block page_heading %} Recipe List {% endblock %}

{% block content %}
        <h1>Recipes:</h1>
        <ul>
            {% for recipe in recipe_list %}
                <li>
                    <a href={{recipe.get_absolute_url}}>{{recipe}}</a>
                </li>
                <br>
            {% endfor %}
        </ul>
{% endblock %}
